# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify documentation entry points
        shell: bash
        run: |
          test -f index.html
          test -f docs/index.html
          test -f results/MK7-REAL-ROUTER-V1.1-EXPERTS-REPORT-2026-08-18.html
          grep -q "MK7-REAL-ROUTER-V1.1-EXPERTS-REPORT-2026-08-18.html" docs/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository so root/, docs/, results/, and assets remain linkable.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
